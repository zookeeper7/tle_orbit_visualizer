name: Deploy demo to GitHub Pages

# Builds the static-only demo (VITE_BACKEND=local) and publishes it to
# GitHub Pages. The demo runs without the Express/SQLite server: every
# visitor gets an isolated copy of the seed data in their browser's
# localStorage.
#
# Repository setup (one-time, by a maintainer with admin rights):
#   Settings → Pages → "Build and deployment" → Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo bundle
        run: npm run build
        env:
          VITE_BACKEND: local
          # Relative base — keeps all asset URLs page-relative so GitHub
          # Pages serves them correctly under /tle_orbit_visualizer/, and
          # also sidesteps vite-plugin-cesium's habit of duplicating an
          # absolute base into the output directory tree.
          VITE_BASE: ./

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
